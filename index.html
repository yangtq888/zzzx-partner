function getUsers() {
  const saved = localStorage.getItem('custom_users');
  if (saved) {
    return { ...INITIAL_USERS, ...JSON.parse(saved) };
  }
  return { ...INITIAL_USERS };
}

const loginPage = document.getElementById('loginPage');
const mainPage = document.getElementById('mainPage');
const loginError = document.getElementById('loginError');
let currentUser = "";

// 检查是否已登录
if (sessionStorage.getItem('isLoggedIn') === 'true') {
  currentUser = sessionStorage.getItem('currentUser');
  loginPage.style.display = 'none';
  mainPage.style.display = 'block';
  initData();
}

// 登录
document.getElementById('loginBtn').addEventListener('click', () => {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const users = getUsers();
  
  if (users[u] && users[u] === p) {
    sessionStorage.setItem('isLoggedIn', 'true');
    sessionStorage.setItem('currentUser', u);
    currentUser = u;
    loginPage.style.display = 'none';
    mainPage.style.display = 'block';
    loginError.style.display = 'none';
    initData();
  } else {
    loginError.style.display = 'block';
  }
});

document.getElementById('loginPass').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

// 退出登录
document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('isLoggedIn');
  sessionStorage.removeItem('currentUser');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  loginError.style.display = 'none';
  loginPage.style.display = 'flex';
  mainPage.style.display = 'none';
});

// 修改密码弹窗控制
const pwdModalBg = document.getElementById('pwdModalBg');
document.getElementById('changePwdBtn').addEventListener('click', () => {
  document.getElementById('oldPwd').value = '';
  document.getElementById('newPwd').value = '';
  document.getElementById('confirmPwd').value = '';
  document.getElementById('pwdError').style.display = 'none';
  document.getElementById('pwdSuccess').style.display = 'none';
  pwdModalBg.classList.add('show');
});

document.getElementById('pwdClose').addEventListener('click', () => pwdModalBg.classList.remove('show'));

// 保存新密码
document.getElementById('savePwdBtn').addEventListener('click', () => {
  const oldP = document.getElementById('oldPwd').value.trim();
  const newP = document.getElementById('newPwd').value.trim();
  const confP = document.getElementById('confirmPwd').value.trim();
  const errBox = document.getElementById('pwdError');
  const sucBox = document.getElementById('pwdSuccess');
  const users = getUsers();

  errBox.style.display = 'none';
  sucBox.style.display = 'none';

  if (users[currentUser] !== oldP) {
    errBox.textContent = '原密码错误，请重试';
    errBox.style.display = 'block';
    return;
  }
  if (!newP || newP.length < 4) {
    errBox.textContent = '新密码不能少于4位';
    errBox.style.display = 'block';
    return;
  }
  if (newP !== confP) {
    errBox.textContent = '两次输入的新密码不一致';
    errBox.style.display = 'block';
    return;
  }

  // 保存新密码到浏览器本地
  const saved = localStorage.getItem('custom_users');
  let customUsers = saved ? JSON.parse(saved) : {};
  customUsers[currentUser] = newP;
  localStorage.setItem('custom_users', JSON.stringify(customUsers));

  sucBox.style.display = 'block';
  setTimeout(() => {
    pwdModalBg.classList.remove('show');
  }, 2000);
});

/* ========== 页面逻辑代码 ========== */
const $ = s => document.querySelector(s);
const state = { kw:"", type:"", industry:"", coop:"", mode:"" };

function initData() {
  renderStats(); 
  renderCards(DATA); 
}

function renderStats(){
  const total = DATA.length;
  const byType = {};
  DATA.forEach(d=>{ if(d.type) byType[d.type] = (byType[d.type]||0)+1; });
  const typeStr = Object.entries(byType).map(([k,v])=>`${k} ${v}`).join(" · ");
  const allInds = [...new Set(DATA.flatMap(d => Array.isArray(d.industry) ? d.industry : []))].filter(Boolean);
  
  $("#stats").innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">登记单位总数</div></div>
    <div class="stat"><div class="num">${allInds.length}</div><div class="lbl">覆盖行业/领域</div></div>
    <div class="stat"><div class="num" style="font-size:13px;line-height:1.5;padding-top:6px">${typeStr}</div><div class="lbl">单位类型分布</div></div>`;
}

function hl(text, kw){
  if(!kw || !text) return text || "";
  const safe = kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return text.replace(new RegExp(safe,"gi"), m=>`<mark>${m}</mark>`);
}

function filterData(){
  const kw = state.kw.trim().toLowerCase();
  
  return DATA.filter(d=>{
    if(state.type && d.type !== state.type) return false;
    if(state.industry && (!d.industry || !d.industry.includes(state.industry))) return false;
    if(state.coop && (!d.coop || !d.coop.includes(state.coop))) return false;
    if(state.mode && (!d.mode || !d.mode.includes(state.mode))) return false;
    
    const allText = [
      d.name, d.type, 
      ...(d.industry||[]), d.contact, d.phone, 
      d.intro, d.qualification, d.research, 
      ...(d.coop||[]), ...(d.mode||[]), 
      d.resources, d.cases, d.dept, d.center, d.remark
    ].join(" ").toLowerCase();
    
    if(kw && !allText.includes(kw)) return false;
    
    return true;
  });
}

function renderCards(list){
  $("#info").textContent = `共找到 ${list.length} 家单位`;
  if(!list.length){ 
    $("#cards").innerHTML = `<div class="empty">没有匹配的单位，试试调整关键词或筛选条件</div>`; 
    return; 
  }
  
  $("#cards").innerHTML = list.map(d=>{
    const tags = [
      `<span class="tag">${d.type || '未知类型'}</span>`,
      ...(d.industry||[]).map(i=>`<span class="tag gray">${i}</span>`),
      ...(d.coop||[]).slice(0,3).map(c=>`<span class="tag warn">${c}</span>`)
    ].join("");
    
    const qualShort = (d.qualification||"暂无详细资质信息").slice(0,60) + ((d.qualification||"").length>60?"…":"");
    
    return `<div class="card" data-id="${d.id}">
      <div class="name">${hl(d.name, state.kw)}</div>
      <div class="tags">${tags}</div>
      <div class="meta"><b>联系人：</b>${hl(d.contact||"-", state.kw)} &nbsp; <b>电话：</b>${hl(d.phone||"-", state.kw)}</div>
      <div class="meta"><b>主要方向：</b>${hl((d.research||"暂无").slice(0,55), state.kw)}${(d.research||"").length>55?"…":""}</div>
      <div class="qual-line">🏅 ${hl(qualShort, state.kw)}</div>
    </div>`;
  }).join("");
  
  document.querySelectorAll(".card").forEach(c=>{
    c.onclick = ()=> openModal(+c.dataset.id);
  });
}

function openModal(id){
  const d = DATA.find(x=>x.id===id);
  if(!d) return;
  $("#mTitle").textContent = d.name;
  const F = (k,v)=> v ? `<div class="field"><div class="k">${k}</div><div class="v">${v}</div></div>` : "";
  
  $("#mBody").innerHTML = `
    ${F("单位类型", d.type)}
    ${F("所属行业/领域", (d.industry||[]).join("、"))}
    ${F("联系人 / 电话", `${d.contact||"-"}　${d.phone||""}`)}
    ${F("单位简介 / 主营业务", d.intro)}
    ${F("资质与认证", d.qualification)}
    ${F("主要科研 / 业务方向", d.research)}
    ${F("合作方向", (d.coop||[]).join("、"))}
    ${F("可提供资源 / 能力", d.resources)}
    ${F("拟合作方式", (d.mode||[]).join("、"))}
    ${F("已有合作案例", d.cases)}
    ${F("中心对接部门", d.dept)}
    ${F("中心联系人 / 联系方式", d.center)}
    ${F("备注", d.remark)}
    ${F("登记日期", d.date)}
  `;
  $("#modalBg").classList.add("show");
}

function exportCSV(){
  const list = filterData();
  const header = ["序号","单位全称","单位类型","所属行业/领域","联系人","联系电话","单位简介/主营业务","资质与认证","主要科研/业务方向","合作方向","可提供资源/能力","拟合作方式","已有合作案例","中心对接部门","中心联系人/联系方式","备注","登记日期"];
  const rows = list.map(d=>[
    d.id, d.name, d.type, (d.industry||[]).join("、"), d.contact, d.phone, d.intro, d.qualification, d.research,
    (d.coop||[]).join("、"), d.resources, (d.mode||[]).join("、"), d.cases, d.dept, d.center, d.remark, d.date
  ]);
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `合作伙伴筛选结果_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function bind(){
  const sync = ()=>{ 
    state.kw=$("#kw").value; 
    state.type=$("#fType").value; 
    state.industry=$("#fIndustry").value;
    state.coop=$("#fCoop").value; 
    state.mode=$("#fMode").value;
    renderCards(filterData()); 
  };
  
  $("#kw").addEventListener("input", sync);
  ["#fType","#fIndustry","#fCoop","#fMode"].forEach(s=>$(s).addEventListener("change", sync));
  
  $("#reset").onclick = ()=>{ 
    $("#kw").value="";
    ["#fType","#fIndustry","#fCoop","#fMode"].forEach(s=>$(s).value="");
    sync(); 
  };
  
  $("#export").onclick = exportCSV;
  $("#mClose").onclick = ()=> $("#modalBg").classList.remove("show");
  $("#modalBg").onclick = e=>{ if(e.target.id==="modalBg") $("#modalBg").classList.remove("show"); };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") $("#modalBg").classList.remove("show"); });
}

bind();
</script>
