/* ========== 以下为逻辑代码，一般无需修改 ========== */
const $ = s => document.querySelector(s);
const state = { kw:"", qual:"", type:"", industry:"", coop:"", mode:"" };

// 初始化下拉选项
function unique(arr){ return [...new Set(arr)].sort(); }
function initSelects(){
  const types = unique(DATA.flatMap(d=>[d.type].filter(Boolean)));
  const inds = unique(DATA.flatMap(d=>d.industry||[]));
  const coops = unique(DATA.flatMap(d=>d.coop||[]));
  const modes = unique(DATA.flatMap(d=>d.mode||[]));
  types.forEach(v=>$("#fType").append(`<option>${v}</option>`));
  inds.forEach(v=>$("#fIndustry").append(`<option>${v}</option>`));
  coops.forEach(v=>$("#fCoop").append(`<option>${v}</option>`));
  modes.forEach(v=>$("#fMode").append(`<option>${v}</option>`));
}

// 统计
function renderStats(){
  const total = DATA.length;
  const byType = {};
  DATA.forEach(d=>{ byType[d.type]=(byType[d.type]||0)+1; });
  const typeStr = Object.entries(byType).map(([k,v])=>`${k} ${v}`).join(" · ");
  $("#stats").innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">登记单位总数</div></div>
    <div class="stat"><div class="num">${unique(DATA.flatMap(d=>d.industry||[])).length}</div><div class="lbl">覆盖行业/领域</div></div>
    <div class="stat"><div class="num">${unique(DATA.flatMap(d=>d.qualification? d.qualification.split(/[、,，;；]/):[])).length}+</div><div class="lbl">资质关键词条目</div></div>
    <div class="stat"><div class="num" style="font-size:13px;line-height:1.5;padding-top:2px">${typeStr}</div><div class="lbl">单位类型分布</div></div>`;
}

// 高亮
function hl(text, kw){
  if(!kw) return text || "";
  const safe = kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return (text||"").replace(new RegExp(safe,"gi"), m=>`<mark>${m}</mark>`);
}

// 筛选
function filterData(){
  const kw = state.kw.trim().toLowerCase();
  const qual = state.qual.trim().toLowerCase();
  return DATA.filter(d=>{
    if(state.type && d.type !== state.type) return false;
    if(state.industry && !(d.industry||[]).includes(state.industry)) return false;
    if(state.coop && !(d.coop||[]).includes(state.coop)) return false;
    if(state.mode && !(d.mode||[]).includes(state.mode)) return false;
    const allText = [d.name,d.type,...(d.industry||[]),d.contact,d.phone,d.intro,d.qualification,d.research,...(d.coop||[]),...(d.mode||[]),d.resources,d.cases,d.dept,d.center,d.remark].join(" ").toLowerCase();
    if(kw && !allText.includes(kw)) return false;
    if(qual && !(d.qualification||"").toLowerCase().includes(qual)) return false;
    return true;
  });
}

// 渲染卡片
function renderCards(list){
  $("#info").textContent = `共找到 ${list.length} 家单位`;
  if(!list.length){ $("#cards").innerHTML = `<div class="empty">没有匹配的单位，试试调整关键词或筛选条件</div>`; return; }
  $("#cards").innerHTML = list.map(d=>{
    const tags = [
      `<span class="tag">${d.type}</span>`,
      ...(d.industry||[]).map(i=>`<span class="tag gray">${i}</span>`),
      ...(d.coop||[]).slice(0,3).map(c=>`<span class="tag warn">${c}</span>`)
    ].join("");
    const qualShort = (d.qualification||"").slice(0,60) + ((d.qualification||"").length>60?"…":"");
    return `<div class="card" data-id="${d.id}">
      <div class="name">${hl(d.name, state.kw)}</div>
      <div class="tags">${tags}</div>
      <div class="meta"><b>联系人：</b>${hl(d.contact||"-", state.kw)} &nbsp; <b>电话：</b>${hl(d.phone||"-", state.kw)}</div>
      <div class="meta"><b>主要方向：</b>${hl((d.research||"").slice(0,55), state.kw)}${(d.research||"").length>55?"…":""}</div>
      <div class="qual-line">🏅 ${hl(qualShort, state.qual || state.kw)}</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".card").forEach(c=>{
    c.onclick = ()=> openModal(+c.dataset.id);
  });
}

// 详情
function openModal(id){
  const d = DATA.find(x=>x.id===id);
  if(!d) return;
  $("#mTitle").textContent = d.name;
  const F = (k,v)=> v ? `<div class="field"><div class="k">${k}</div><div class="v">${v}</div></div>` : "";
  $("#mBody").innerHTML = `
    ${F("单位类型", d.type)}
    ${F("所属行业/领域", (d.industry||[]).join("、"))}
    ${F("联系人 / 电话", `${d.contact||"-"}　${d.phone||""}`)}
    ${F("单位简介 / 主营业务", d.intro)}
    ${F("资质与认证", d.qualification)}
    ${F("主要科研 / 业务方向", d.research)}
    ${F("合作方向", (d.coop||[]).join("、"))}
    ${F("可提供资源 / 能力", d.resources)}
    ${F("拟合作方式", (d.mode||[]).join("、"))}
    ${F("已有合作案例", d.cases)}
    ${F("中心对接部门", d.dept)}
    ${F("中心联系人 / 联系方式", d.center)}
    ${F("备注", d.remark)}
    ${F("登记日期", d.date)}
  `;
  $("#modalBg").classList.add("show");
}

// 导出 CSV
function exportCSV(){
  const list = filterData();
  const header = ["序号","单位全称","单位类型","所属行业/领域","联系人","联系电话","单位简介/主营业务","资质与认证","主要科研/业务方向","合作方向","可提供资源/能力","拟合作方式","已有合作案例","中心对接部门","中心联系人/联系方式","备注","登记日期"];
  const rows = list.map(d=>[
    d.id,d.name,d.type,(d.industry||[]).join("、"),d.contact,d.phone,d.intro,d.qualification,d.research,
    (d.coop||[]).join("、"),d.resources,(d.mode||[]).join("、"),d.cases,d.dept,d.center,d.remark,d.date
  ]);
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `合作伙伴筛选结果_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// 绑定事件
function bind(){
  const sync = ()=>{ state.kw=$("#kw").value; state.qual=$("#qual").value;
    state.type=$("#fType").value; state.industry=$("#fIndustry").value;
    state.coop=$("#fCoop").value; state.mode=$("#fMode").value;
    renderCards(filterData()); };
  ["#kw","#qual"].forEach(s=>$(s).addEventListener("input", sync));
  ["#fType","#fIndustry","#fCoop","#fMode"].forEach(s=>$(s).addEventListener("change", sync));
  $("#reset").onclick = ()=>{ $("#kw").value=""; $("#qual").value="";
    ["#fType","#fIndustry","#fCoop","#fMode"].forEach(s=>$(s).value="");
    sync(); };
  $("#export").onclick = exportCSV;
  $("#mClose").onclick = ()=> $("#modalBg").classList.remove("show");
  $("#modalBg").onclick = e=>{ if(e.target.id==="modalBg") $("#modalBg").classList.remove("show"); };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") $("#modalBg").classList.remove("show"); });
}

initSelects(); renderStats(); renderCards(DATA); bind();
</script>
